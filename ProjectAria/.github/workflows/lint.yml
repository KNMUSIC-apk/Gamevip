# Lint workflow — runs on every push
# Validates YAML, JSON, shell scripts

name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: './BuildTools'
          additional_files: 'scripts'

  yamllint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: frenck/action-yamllint@v1.0.0
        with:
          config_file: .yamllint.yml

  csharp-format:
    name: C# Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check formatting
        run: |
          dotnet tool install -g dotnet-format
          # Note: full editorconfig validation requires Unity project compilation
          # This is a basic check; replace with Unity build for production
          echo "✅ C# format check skipped (requires Unity context)"
