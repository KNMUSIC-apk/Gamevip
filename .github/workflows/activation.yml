name: Acquire License
on:
  workflow_dispatch:
jobs:
  activation:
    name: Request manual license file
    runs-on: ubuntu-latest
    steps:
      # BẮT BUỘC: Checkout code để action đọc được version Unity
      - name: Checkout repository
        uses: actions/checkout@v4

      # ĐÃ SỬA: Dùng action chính thức của GitHub
      - name: Request manual license file
        uses: github-actions/unity-activation@v1
        id: get-alf

      # Upload file .alf lên Artifacts để tải về
      - name: Upload ALF
        uses: actions/upload-artifact@v4
        with:
          name: UnityLicenseRequest
          # Đường dẫn output của action chính thức thường là filePath
          path: ${{ steps.get-alf.outputs.filePath }}
