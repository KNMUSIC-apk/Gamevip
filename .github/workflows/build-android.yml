# ============================================================
# GitHub Actions — Build Android APK on push
# Triggers: every push to main, every PR, manual dispatch
# Output: ProjectAria.apk artifact downloadable from Actions tab
# ============================================================

name: Build Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - development

env:
  UNITY_VERSION: 2022.3.20f1
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Cache Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/manifest.json') }}
          restore-keys: |
            Library-${{ runner.os }}-
            Library-

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: ProjectAria.Editor.BuildScript.BuildAndroid
          customParameters: -buildTarget Android
          versioning: None
          outputPath: Builds/Android/ProjectAria.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProjectAria-${{ github.sha }}
          path: Builds/Android/ProjectAria.apk
          if-no-files-found: error
          retention-days: 14

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: Builds/Android/ProjectAria.apk
          fail_on_unmatched_files: true
