name: Build Android APK

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - development

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'release' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: ProjectAria/Library
          key: Library-Android-${{ hashFiles('ProjectAria/Packages/manifest.json') }}
          restore-keys: |
            Library-Android-

      - name: Setup Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ProjectAria
          targetPlatform: Android
          buildName: ProjectAria
          # Tuyệt đối không dùng dòng outputPath ở đây để tránh lỗi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android-APK
          path: build/Android
